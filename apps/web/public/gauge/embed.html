<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>xFP 게이지 미리보기</title>
<style>
/* 게이지 카드 = 디자이너 Figma 시안(08 페이지 578:1426 · 578:2389, 10/21) 값 그대로. 콘솔 iframe 임베드용. */
:root { --bg: #0B0E13; --panel: #141922; --line: #262E3A; --fg: #F2F4F7; --sub: #98A3B5; --or: #FF7400; --gold: #FFC24A; --blue: #4377EB;
  --ui: "WS", "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif; color-scheme: dark; }
@font-face { font-family: "WS"; src: url(media/fonts/WantedSans-ExtraBold.ttf); font-weight: 800; font-display: swap; }
@font-face { font-family: "WS"; src: url(media/fonts/WantedSans-Black.ttf); font-weight: 900; font-display: swap; }
@font-face { font-family: "Giants"; src: url(media/fonts/Giants-Bold.otf); font-weight: 700; font-display: swap; }
html, body { margin: 0; background: transparent; color: var(--fg); font-family: var(--ui); }
.wrap { display: grid; gap: 10px; padding: 4px; }
.bar { display: flex; align-items: center; gap: 8px; }
.btn { font: 800 13px var(--ui); color: #1A0C00; background: var(--or); border: 0; border-radius: 8px; padding: 6px 12px; cursor: pointer; }
#scrub { flex: 1; accent-color: var(--or); }
#tc { font: 700 12px var(--ui); color: var(--sub); font-variant-numeric: tabular-nums; min-width: 86px; text-align: right; }
.stage { overflow: hidden; border-radius: 12px; background: #F4F4F4; padding: 34px 0 14px; }
.scale { width: 754px; height: 252px; transform-origin: 0 0; }
#empty { font: 700 13px var(--ui); color: var(--sub); padding: 40px 12px; text-align: center; }
.gauge { position: relative; width: 754px; height: 252px; }
.card { position: absolute; inset: 0; box-sizing: border-box; border: 1.5px solid #474747; border-radius: 12px; overflow: hidden; background: linear-gradient(113.46deg, #000 0.27%, rgba(32,32,32,.8) 99.73%), #000; }
.card img { position: absolute; left: 0; top: 0; width: 485px; height: 252px; }
#ttl { position: absolute; left: 38px; top: 38.5px; font: 800 45px/54px var(--ui); white-space: nowrap; }
#ttl.opp { color: #AFC4FF; }
#ttl.own { color: var(--or); }
#who { position: absolute; right: 138px; top: 32.8px; height: 71px; display: flex; align-items: center; gap: 6px; }
#who .score { font: 800 59.6px/71px var(--ui); color: var(--or); font-variant-numeric: tabular-nums; } #who .score small { font-size: 25.2px; font-weight: 700; margin-left: 1px; } #who .score.gold { color: var(--gold); }
.hx { position: relative; width: 56px; height: 56px; } .hx img { position: absolute; inset: 0; width: 100%; height: 100%; }
.hx span, .ob.home span { position: absolute; inset: 0; display: grid; place-items: center; font-family: Giants, var(--ui); font-weight: 700; color: #000; padding-top: 1px; }
.hx span { font-size: 18px; } .hx.gold { filter: drop-shadow(0 0 9px rgba(255,200,80,1)); }
.strip { position: absolute; left: 38px; top: 128px; width: 676px; height: 84px; }
.grass { position: absolute; inset: 0; border-radius: 8px; background: repeating-linear-gradient(90deg, #2b3041 0 68px, #323849 68px 136px); }
.fill { position: absolute; top: 0; bottom: 0; border-radius: 8px; }
.fill.left { left: 0; } .fill.right { right: 0; }
.fill.attack { background: linear-gradient(90deg, rgba(255,116,0,.08), rgba(255,116,0,.55)); border-right: 3px solid var(--or); }
.fill.threat { background: linear-gradient(90deg, rgba(67,119,235,.04), rgba(67,119,235,.6)); border-right: 3px solid var(--blue); }
.fill.drain { background: linear-gradient(90deg, rgba(67,119,235,.04), rgba(67,119,235,.45)); border-right: 3px solid var(--or); }
.fill.done { background: linear-gradient(90deg, rgba(255,116,0,.15), rgba(255,200,90,.75)); }
.fill.miss { background: linear-gradient(90deg, rgba(138,148,166,.12), rgba(160,170,186,.7)); border-right: 3px solid #A9B2C2; }
.fill.right { transform: scaleX(-1); }
.goal { position: absolute; top: 10px; bottom: 10px; width: 34px; border: 4px solid #fff; box-sizing: border-box; background: rgba(255,255,255,.1); }
.goal.right { right: -34px; border-left: 0; } .goal.left { left: -34px; border-right: 0; }
.goal.own { border-color: #8FB0FF; background-color: rgba(67,119,235,.18); }
.goal.scored { border-color: #FFE27A; box-shadow: 0 0 18px rgba(255,190,80,.9), inset 0 0 12px rgba(255,190,80,.6); }
#obs { position: absolute; inset: 0; }
.glow { position: absolute; top: 50%; width: 118px; height: 118px; border-radius: 50%; z-index: 1; pointer-events: none; border: 3px solid rgba(255,150,40,.85); background: radial-gradient(circle, rgba(255,140,0,.45), rgba(255,140,0,0) 68%); box-shadow: 0 0 26px rgba(255,150,40,.7); }
.ob { position: absolute; top: 50%; transform: translate(-50%, -50%); } .ob img { position: absolute; inset: 0; width: 100%; height: 100%; }
.ob.home.main { z-index: 4; filter: drop-shadow(0 0 8px rgba(255,160,60,1)); }
.ob.home.best { z-index: 6; filter: drop-shadow(0 0 10px rgba(255,210,90,1)) drop-shadow(0 0 4px rgba(255,230,150,1)); }
.ob.away { width: 50px; height: 50px; z-index: 2; }
.ob.away.lead { width: 58px; height: 58px; z-index: 4; filter: drop-shadow(0 0 8px rgba(120,160,255,1)); }
.ob.away.beat { width: 40px; height: 40px; filter: grayscale(1); }
.ob.ball { width: 32px; height: 32px; z-index: 5; }
.trail { position: absolute; top: 50%; height: 34px; transform: translateY(-50%); background-repeat: repeat-x; background-size: auto 100%; background-position: right center; filter: drop-shadow(0 0 4px #FFB56D); z-index: 3; }
.trail.past { filter: none; }
.tag { position: absolute; top: 2px; font: 800 14px var(--ui); color: #1A0C00; background: var(--or); border-radius: 6px; padding: 1px 6px; z-index: 6; }
.bestseg { position: absolute; top: 4px; bottom: 4px; border-radius: 8px; z-index: 2; border: 2px solid rgba(255,214,110,.9); box-shadow: 0 0 16px rgba(255,190,80,.7); background: linear-gradient(100deg, rgba(255,200,90,.18) 0, rgba(255,200,90,.18) calc(var(--sw) - 18%), rgba(255,240,190,.85) var(--sw), rgba(255,200,90,.18) calc(var(--sw) + 18%)); }
#svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.total { position: absolute; right: 0; top: 80px; display: flex; align-items: baseline; gap: 6px; font: 900 35px var(--ui); color: #fff; line-height: 1; }
.plabel { font: 800 13px var(--ui); opacity: .6; }
.total.blue { color: #AFC4FF; } .total.gold { color: var(--gold); text-shadow: 0 0 14px rgba(255,190,80,.9); }
.total small { font-size: .55em; margin-left: 2px; opacity: .6; }
.odo { display: inline-flex; } .odc { display: inline-block; height: 1.2em; line-height: 1.2em; overflow: hidden; -webkit-mask-image: linear-gradient(transparent, #000 8%, #000 92%, transparent); mask-image: linear-gradient(transparent, #000 8%, #000 92%, transparent); } .ods { display: block; line-height: 1.2em; text-align: center; }
.pop { position: absolute; transform: translateX(-50%); font: 900 28px var(--ui); color: var(--or); line-height: 1; z-index: 6; }
#stamp { position: absolute; left: 625px; top: -4px; width: 140px; height: 140px; opacity: 0; pointer-events: none; z-index: 7; }
#stamp img { width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar"><button type="button" class="btn" id="play">일시정지</button><input type="range" id="scrub" min="0" max="1" step="0.001" value="0" aria-label="시간"><span id="tc"></span></div>
  <div class="stage">
    <div id="empty">클립을 선택하면 게이지가 재생됩니다</div>
    <div class="scale" id="scale" hidden>
      <div class="gauge" id="gauge">
        <div class="card"><img id="hexbg" src="media/img/card_hex_orange.svg" alt=""></div>
        <div id="ttl"></div><div id="who"></div>
        <div class="strip"><div class="grass"></div><div class="fill" id="fill"></div><i class="goal" id="goal"></i><div id="obs"></div><svg id="svg"></svg><div id="pops"></div><div class="total" id="total"></div></div>
        <div id="stamp"><img src="media/img/stamp_verified_360.png" alt="Fine Play VERIFIED"></div>
      </div>
    </div>
  </div>
</div>
<script src="gauge_core.js"></script>
<script src="embed.js"></script>
</body>
</html>
