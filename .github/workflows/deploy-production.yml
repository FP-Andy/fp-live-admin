name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type deploy-production to run production deployment.
        required: true
        type: string

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy app server
    if: github.event.inputs.confirm == 'deploy-production'
    runs-on: [self-hosted, live-admin-app, production]
    timeout-minutes: 40
    environment: production
    steps:
      - name: Deploy locally on app server
        run: |
          set -Eeuo pipefail

          APP_DIR="/home/ubuntu/fp-live-admin"
          COMPOSE_FILE="infra/app/docker-compose.yml"
          BACKUP_ROOT="/home/ubuntu/deploy-backups"
          DEPLOY_ID="gha-${{ github.sha }}-$(date -u +%Y%m%d_%H%M%S)"

          cd "$APP_DIR"
          mkdir -p "$BACKUP_ROOT"

          if [ -n "$(git status --porcelain=v1 --untracked-files=all)" ]; then
            BACKUP_DIR="$BACKUP_ROOT/$DEPLOY_ID"
            mkdir -p "$BACKUP_DIR"
            git status --porcelain=v1 --untracked-files=all > "$BACKUP_DIR/status.txt"
            git diff > "$BACKUP_DIR/worktree.patch" || true
            git diff --cached > "$BACKUP_DIR/index.patch" || true
            git ls-files --others --exclude-standard > "$BACKUP_DIR/untracked.txt"
            echo "Saved pre-deploy working tree snapshot to $BACKUP_DIR"
          fi

          git fetch origin main
          git reset --hard origin/main
          git clean -fd
          git checkout -B main origin/main

          docker compose -f "$COMPOSE_FILE" build api web highlight-render

          # Reject a missing/invalid private account manifest before replacing
          # the running API. This check imports no DB code or delivery workers.
          docker compose -f "$COMPOSE_FILE" run --rm --no-deps -T --entrypoint python api - <<'PY'
          import json, os
          from pathlib import Path
          from app.auth_security import normalize_login, valid_secret_hash
          payload = json.loads(Path(os.environ["FPC_ADMIN_ACCOUNTS_FILE"]).read_text())
          accounts = payload.get("accounts")
          assert payload.get("version") == 1 and isinstance(accounts, list) and accounts, "Invalid account manifest"
          seen = set()
          for entry in accounts:
              login = normalize_login(entry["login"])
              name = entry["name"].strip()
              assert 0 < len(login) <= 80 and 0 < len(name) <= 80 and login not in seen, "Invalid account entry"
              assert valid_secret_hash(entry["password_hash"]), "Invalid account hash"
              seen.add(login)
          print(f"Private administrator manifest verified: {len(accounts)} accounts")
          PY

          # potoken(유튜브 PO 토큰 발급기)도 함께 띄운다. 빌드가 없는 기성 이미지라
          # up 만으로 받는다. 이걸 빼먹어서 코드만 배포되고 컨테이너가 안 생겨,
          # 유튜브 취득이 360p 로 떨어진 적이 있다(2026-09-30).
          docker compose -f "$COMPOSE_FILE" up -d potoken api web highlight-render
          docker compose -f "$COMPOSE_FILE" ps potoken api web highlight-render

          # `up -d` returns once the container process starts, but uvicorn only
          # binds :8000 after startup (schema migration + seeding + workers).
          # Poll the in-container health endpoint until it is ready instead of
          # hitting it once and racing the boot.
          echo "Waiting for api to become healthy..."
          api_healthy=false
          for i in $(seq 1 30); do
            if docker compose -f "$COMPOSE_FILE" exec -T api \
                 python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)" >/dev/null 2>&1; then
              echo "api healthy after ${i} attempt(s)"
              api_healthy=true
              break
            fi
            sleep 2
          done
          if [ "$api_healthy" != "true" ]; then
            echo "api did not become healthy within ~60s"
            docker compose -f "$COMPOSE_FILE" logs --tail=80 api
            exit 1
          fi
          docker compose -f "$COMPOSE_FILE" exec -T api python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read().decode())"

          # potoken 이 실제로 응답하는지 본다. 실패해도 배포는 계속한다 —
          # 화질 저하는 감수할 수 있지만 배포 전체가 막히면 안 된다. 대신 크게 남긴다.
          echo "Checking potoken (YouTube PO token provider)..."
          potoken_ok=false
          for i in $(seq 1 10); do
            if docker compose -f "$COMPOSE_FILE" exec -T api python -c "import urllib.request; urllib.request.urlopen('http://potoken:4416/ping', timeout=3)" >/dev/null 2>&1; then
              echo "potoken healthy after ${i} attempt(s)"
              potoken_ok=true
              break
            fi
            sleep 2
          done
          if [ "$potoken_ok" != "true" ]; then
            echo "::warning::potoken 이 응답하지 않습니다 — 유튜브 취득이 저화질로 떨어질 수 있습니다"
            docker compose -f "$COMPOSE_FILE" logs --tail=30 potoken || true
          fi

          # api/web are recreated above, so nginx needs a reload to resolve
          # their new Docker network addresses. Its config is file-mounted;
          # git can replace that source inode, leaving a long-lived container
          # attached to the previous file. Recreate nginx only when its
          # loaded config hash differs, otherwise a reload is enough.
          source_nginx_hash="$(sha256sum "$APP_DIR/infra/app/nginx/default.conf" | awk '{print $1}')"
          loaded_nginx_hash="$(docker compose -f "$COMPOSE_FILE" exec -T nginx sha256sum /etc/nginx/conf.d/default.conf 2>/dev/null | awk '{print $1}' || true)"
          if [ "$source_nginx_hash" != "$loaded_nginx_hash" ]; then
            echo "Nginx config changed; recreating nginx to mount the current file"
            docker compose -f "$COMPOSE_FILE" up -d --force-recreate nginx
          else
            docker compose -f "$COMPOSE_FILE" exec -T nginx nginx -s reload
          fi

          # External check through nginx, with a short retry for edge readiness.
          for i in $(seq 1 10); do
            if curl -fsS https://console.fineludens.kr/health; then
              echo; echo "external health ok after ${i} attempt(s)"
              break
            fi
            if [ "$i" -eq 10 ]; then echo "external health check failed"; exit 1; fi
            sleep 2
          done

          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "production checkout no longer matches origin/main; rerun the deployment"
            exit 1
          fi
          echo "production revision verified: $(git rev-parse HEAD)"
