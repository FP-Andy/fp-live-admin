name: FPC regression checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-and-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: pip install -r apps/api/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Synthetic checkout restore drill
        run: python scripts/test_deploy_snapshot.py -v
      - name: Session policy and full application write routes (workers disabled)
        run: |
          python apps/api/tests/test_auth.py -v
          python apps/api/tests/test_match_write_access.py -v
      - name: Individual manual clips and scene downloads
        run: python apps/api/tests/test_manual_clip_results.py -v

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --prefix apps/web
      - name: Type check and draft recovery contracts
        run: |
          node apps/web/node_modules/typescript/bin/tsc --noEmit --incremental false -p apps/web/tsconfig.json
          node scripts/test-manual-draft.cjs
          node scripts/test-report-recovery.cjs
          node scripts/test-futsal-match-report.cjs
          node scripts/test-futsal-team-report.cjs
          node scripts/test-futsal-report-stories.cjs
          node scripts/test-futsal-substitution-report.mjs
      - name: Production web build
        run: npm run build --prefix apps/web
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: node apps/web/node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Browser failure and recovery contracts (fixture APIs only)
        shell: bash
        run: |
          set -euo pipefail
          NEXT_DIST_DIR=.next-qa node apps/web/node_modules/next/dist/bin/next dev apps/web --hostname 127.0.0.1 --port 4354 > "$RUNNER_TEMP/fpc-ui.log" 2>&1 &
          ui_pid=$!
          trap 'kill "$ui_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..30}; do
            if curl --silent --output /dev/null http://127.0.0.1:4354/login; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat "$RUNNER_TEMP/fpc-ui.log"; exit 1; fi
          FPC_QA_OUTPUT="$RUNNER_TEMP/fpc-save-qa" node scripts/test-fpc-save-recovery-ui.cjs
          FPC_REPORT_QA_OUTPUT="$RUNNER_TEMP/fpc-report-qa" node scripts/test-report-recovery-ui.cjs
          FPC_DIALOG_QA_OUTPUT="$RUNNER_TEMP/fpc-dialog-qa" node scripts/test-completion-dialog-ui.cjs
