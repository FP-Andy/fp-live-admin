name: FPC regression checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-and-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: pip install -r apps/api/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Validate production service configuration
        run: docker compose -p fpc-check -f infra/app/docker-compose.yml config --quiet
      - name: Synthetic checkout restore drill
        run: |
          python scripts/test_deploy_snapshot.py -v
          python scripts/test_courtside_export_release.py -v
          python scripts/test_courtside_deploy_workflow.py -v
      - name: Safe Docker image and build cache retention
        run: python scripts/test_docker_cleanup.py -v
      - name: Courtside access and resumable recording contracts
        env:
          DATABASE_URL: sqlite:////tmp/courtside-contracts.sqlite
        run: PYTHONPATH=apps/api python -m unittest discover -s apps/api/tests -p 'test_courtside_*.py' -v
      - name: Bounded tracking crop filters
        run: PYTHONPATH=scripts python -m unittest scripts/test_fpa_cv_substitution_redetect.py scripts/test_fpa_cv_recovery_jobs.py scripts/test_fpa_cv_jobs.py -v
      - name: Session policy and full application write routes (workers disabled)
        run: |
          python apps/api/tests/test_auth.py -v
          python apps/api/tests/test_match_write_access.py -v
          python apps/api/tests/test_agent_fla.py -v
          python apps/api/tests/test_outbox_recovery.py -v
          PYTHONPATH=apps/api python -m unittest discover -s apps/api/tests -p test_fla_video.py -v
          PYTHONPATH=apps/api python -m unittest discover -s apps/api/tests -p test_analysis_snapshots.py -v
          PYTHONPATH=apps/api:apps/api/tests python -m unittest test_recovery_jobs -v
      - name: Individual manual clips and scene downloads
        run: |
          python apps/api/tests/test_manual_clip_results.py -v
          python apps/api/tests/test_highlight_render_queue.py
          python apps/api/tests/test_scene_motion_renderer.py -v
          python apps/api/tests/test_scene_motion_queue.py -v

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --prefix apps/web
      - name: Type check and draft recovery contracts
        run: |
          node apps/web/node_modules/typescript/bin/tsc --noEmit --incremental false -p apps/web/tsconfig.json
          node --test apps/web/tests/match-control.test.cjs
          node --test apps/web/tests/courtside-production-routes.test.cjs
          node --test scripts/kbl_grayzone/*.mjs
          node --test apps/web/tests/fpa-log-edit.test.cjs
          node scripts/test-manual-draft.cjs
          node scripts/test-highlight-log.cjs
          node scripts/test-report-recovery.cjs
          node scripts/test-basketball-persistence.cjs
          node scripts/test-futsal-match-report.cjs
          node scripts/test-futsal-team-report.cjs
          node scripts/test-futsal-report-stories.cjs
          node scripts/test-futsal-substitution-report.mjs
          node scripts/test-futsal-substitution-observations.mjs
          node scripts/test-futsal-substitution-redetection.mjs
          node scripts/test-futsal-substitution-continuity.mjs
          node scripts/test-futsal-substitution-refinement.mjs
          node --test scripts/test-futsal-substitution-volume.mjs
          node scripts/test-futsal-substitution-recovery-plan.mjs
          node --test tests/substitution-identity-guard.test.mjs tests/substitution-reviewed-worker.test.cjs apps/web/tests/report-evidence.test.cjs
      - name: Production web build
        run: npm run build --prefix apps/web
      - name: Install browser test media tools
        timeout-minutes: 4
        run: |
          # The hosted runner's Azure HTTP mirror can throttle large codec
          # packages for several minutes. Use Ubuntu's signed HTTPS archive.
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Acquire::Retries=2 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::https::Timeout=30 install -y --no-install-recommends ffmpeg
      # Match the supported operator browser, including H.264 MP4 decoding.
      - run: node apps/web/node_modules/playwright-core/cli.js install --with-deps chrome
      - name: Browser failure and recovery contracts (fixture APIs only)
        env:
          CHROME_PATH: /usr/bin/google-chrome
          CHROMIUM_PATH: /usr/bin/google-chrome
          SCENE_MOTION_RENDER_TOKEN: fixture-render-token
          SCENE_MOTION_CAPTURE_ORIGIN: http://127.0.0.1:4354
        shell: bash
        run: |
          set -euo pipefail
          NEXT_DIST_DIR=.next-qa node apps/web/node_modules/next/dist/bin/next dev apps/web --hostname 127.0.0.1 --port 4354 > "$RUNNER_TEMP/fpc-ui.log" 2>&1 &
          ui_pid=$!
          trap 'kill "$ui_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..30}; do
            if curl --silent --output /dev/null http://127.0.0.1:4354/login; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat "$RUNNER_TEMP/fpc-ui.log"; exit 1; fi
          FPC_QA_OUTPUT="$RUNNER_TEMP/fpc-save-qa" node scripts/test-fpc-save-recovery-ui.cjs
          FPC_LOG_QA_OUTPUT="$RUNNER_TEMP/fpc-log-qa" node scripts/test-highlight-log-ui.cjs
          FPC_REPORT_QA_OUTPUT="$RUNNER_TEMP/fpc-report-qa" node scripts/test-report-recovery-ui.cjs
          FPC_OWNER_QA_OUTPUT="$RUNNER_TEMP/fpc-owner-qa" node scripts/test-draft-ownership-ui.cjs
          FPC_SESSION_QA_OUTPUT="$RUNNER_TEMP/fpc-session-qa" node scripts/test-session-refresh-ui.cjs
          FPC_CLOCK_QA_OUTPUT="$RUNNER_TEMP/fpc-clock-qa" node scripts/test-possession-clock-ui.cjs
          FPC_CLOCK_QA_OUTPUT="$RUNNER_TEMP/fpc-reliability-qa" node scripts/test-match-control-reliability.cjs
          FPC_FLA_QA_OUTPUT="$RUNNER_TEMP/fpc-fla-qa" node scripts/test-fla-recording-recovery-ui.cjs
          FPC_BASKETBALL_QA_OUTPUT="$RUNNER_TEMP/fpc-basketball-qa" node scripts/test-basketball-recovery-ui.cjs
          CLIP_QA_ORIGIN=http://127.0.0.1:4354 CLIP_QA_OUTPUT="$RUNNER_TEMP/fpc-clips-qa" node scripts/test-manual-clip-results-ui.cjs
          FPC_DIALOG_QA_OUTPUT="$RUNNER_TEMP/fpc-dialog-qa" node scripts/test-completion-dialog-ui.cjs
          SCENE_QA_OUTPUT="$RUNNER_TEMP/fpc-scene-qa" node scripts/test-scene-motion-mp4.cjs
      - name: Browser regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fpc-browser-regression
          path: |
            ${{ runner.temp }}/fpc-ui.log
            ${{ runner.temp }}/fpc-*-qa/*.json
            ${{ runner.temp }}/fpc-*-qa/*.txt
            ${{ runner.temp }}/fpc-*-qa/*.png
          retention-days: 7

  courtside-enabled-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --prefix apps/web
      - name: Build with Courtside enabled
        env:
          NEXT_PUBLIC_COURTSIDE_ENABLED: '1'
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm --prefix apps/web run build

  courtside-worker-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r infra/app/courtside-qa-requirements.txt
      - name: Verify disabled production wiring
        run: python scripts/test_courtside_production_guard.py -v
      - name: Verify explicit worker build context
        run: python scripts/test_courtside_worker_context.py -v
      - name: Isolated worker, upload recovery, renderer and GPU contracts
        env:
          PYTHONPATH: scripts/kbl_grayzone
        run: |
          python -m unittest test_report_assets test_worker_release_manifest test_pose_mesh_builder test_gpu_bridge test_gpu_eic_transport test_cloud_preflight test_video_depth test_video_jobs test_private_worker_smoke -v

  courtside-worker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build worker from pinned Linux inputs
        run: docker build --platform linux/amd64 -f infra/app/Dockerfile.courtside-worker -t courtside-worker-ci .
      - name: Shared store and worker socket
        run: bash scripts/test_courtside_image_socket.sh courtside-worker-ci
      - name: Worker contracts in isolated container
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp:rw,exec,nosuid,nodev,size=3g,mode=1777 \
            -e TMPDIR=/tmp -e PYTHONPATH=/workspace/scripts/kbl_grayzone -e OMP_NUM_THREADS=1 -e OPENBLAS_NUM_THREADS=1 \
            --entrypoint python courtside-worker-ci -m unittest test_report_assets test_worker_release_manifest test_pose_mesh_builder test_gpu_bridge test_cloud_preflight test_video_depth test_video_jobs test_private_worker_smoke -q
      - name: Versioned 11-page PDF in isolated container
        run: |
          docker run --rm --network none -e COURTSIDE_ISOLATED_QA=1 -e COURTSIDE_QA_TOKEN=ci-only-not-secret \
            -e PYTHONPATH=/workspace/scripts/kbl_grayzone -e OMP_NUM_THREADS=1 -e OPENBLAS_NUM_THREADS=1 \
            --entrypoint /bin/sh courtside-worker-ci -c 'printf %s ci-only-not-secret > /workspace/.isolated-courtside-test && python scripts/kbl_grayzone/test_private_pdf_smoke.py -v'
      - name: S3 relay remains readable by unprivileged worker
        run: |
          docker run --rm --network none --read-only --user 0 --tmpfs /tmp:rw,nosuid,nodev,size=3g \
            -v "$PWD/apps/api/app/courtside_recording_source.py:/qa/source.py:ro" \
            -v "$PWD/apps/api/tests/test_courtside_recording_external.py:/qa/test.py:ro" \
            --entrypoint /bin/sh courtside-worker-ci -c 'mkdir /tmp/app && cp /qa/source.py /tmp/app/courtside_recording_source.py && touch /tmp/app/__init__.py && PYTHONPATH=/tmp python /qa/test.py -v'

  postgres-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: fpc_local_test_only
          POSTGRES_DB: fpc_release_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r apps/api/requirements.txt
      - name: Actual application and PostgreSQL ownership/revision contention
        env:
          FPC_TEST_DATABASE_URL: postgresql+psycopg2://postgres:fpc_local_test_only@127.0.0.1:5432/fpc_release_qa
        run: |
          python apps/api/tests/test_match_write_access.py -v
          python apps/api/tests/test_agent_fla.py -v
          python apps/api/tests/test_highlight_render_queue.py
          python apps/api/tests/test_scene_motion_queue.py -v
