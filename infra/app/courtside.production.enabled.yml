# Use only together with courtside.production.disabled.yml after provisioning
# the isolated store, reviewed release, fixed T4 IAM role and private configs.
# GPU access needs the T4 sshd EIC command and pinned host key. The browser
# feature is enabled at build time; no AWS access keys or SSH keys are mounted.
services:
  api:
    volumes:
      - recording_data:/courtside-recordings:ro
    environment:
      COURTSIDE_ALLOW_GPU_ACTIONS: '1'
      COURTSIDE_ALLOW_RECORDING_RELAY: '1'
      COURTSIDE_RECORDING_ROOT: /courtside-recordings
  web:
    build:
      args:
        NEXT_PUBLIC_COURTSIDE_ENABLED: '1'
  courtside-v2:
    entrypoint: ['/usr/local/bin/python', 'scripts/kbl_grayzone/gpu_eic_bootstrap.py']
    environment:
      KBL_GPU_DISABLED: '0'
      KBL_VIDEO_RENDER_ENABLED: '1'
      KBL_BLENDER: /opt/courtside-blender/blender
    volumes:
      - ${COURTSIDE_EIC_GPU_CONFIG:?Set reviewed gpu.json}:/workspace/runtime/kbl-cv/gpu.json:ro
      - ${COURTSIDE_EIC_KNOWN_HOSTS:?Set pinned T4 host key}:/run/courtside-credentials/t4-known-hosts:ro
      - ${COURTSIDE_BLENDER_ROOT:?Set the verified Blender release}:/opt/courtside-blender:ro
      - ${COURTSIDE_MPFB_ROOT:?Set the verified MPFB release}:/workspace/runtime/kbl-mpfb/mpfb2-master:ro
  courtside-eic:
    profiles: [courtside-eic]
    image: ${COURTSIDE_WORKER_IMAGE:?Set the reviewed immutable worker image}
    init: true
    restart: unless-stopped
    user: '1000:1000'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 48
    entrypoint: ['/usr/local/bin/python', '/workspace/scripts/kbl_grayzone/gpu_eic_transport.py', 'broker', '--socket', '/workspace/run/t4.sock', '--config', '/run/courtside-credentials/broker.json']
    environment:
      PYTHONDONTWRITEBYTECODE: '1'
    volumes:
      - ${COURTSIDE_STORE_HOST:?Set dedicated store}/run:/workspace/run
      - ${COURTSIDE_EIC_BROKER_CONFIG:?Set private reviewed broker config}:/run/courtside-credentials/broker.json:ro
    networks: [courtside-eic-egress]
networks:
  courtside-eic-egress: {}
