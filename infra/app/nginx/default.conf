server {
  listen 80;
  server_name console.fineludens.kr _;

  client_max_body_size 3g;
  client_body_timeout 3600s;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location /api/ {
    proxy_pass http://api:8000/api/;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /health {
    proxy_pass http://api:8000/health;
    proxy_set_header Host $host;
  }

  location /hls/ {
    proxy_pass http://172.31.95.167:8080/hls/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    add_header Access-Control-Allow-Origin * always;
    add_header Cache-Control no-cache always;
  }

  # FPA 축구 피치 — 빌드에 포함된 불변 정적 자산이라 브라우저가 재진입 때마다
  # 웹 컨테이너에서 다시 내려받지 않게 한다.
  location = /scene/pitch.webp {
    proxy_pass http://web:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Next.js의 정적 파일 기본 no-cache를 제거하고, 이 피치 전용 캐시 정책을 적용한다.
    proxy_hide_header Cache-Control;
    expires 1d;
    add_header Cache-Control "public, max-age=86400";
  }

  location / {
    proxy_pass http://web:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

server {
  listen 443 ssl http2;
  server_name console.fineludens.kr;

  ssl_certificate /etc/letsencrypt/live/console.fineludens.kr/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/console.fineludens.kr/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_prefer_server_ciphers off;

  client_max_body_size 3g;
  client_body_timeout 3600s;

  location /api/ {
