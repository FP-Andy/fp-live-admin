services:
  postgres:
    image: postgres:16-alpine
    container_name: app-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: live_admin
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ../../apps/api
    container_name: app-api
    restart: unless-stopped
    extra_hosts:
      - "stream.fineludens.kr:3.227.35.90"
    volumes:
      - ../../templetes:/app/templetes:ro
      - ../../assets/fonts:/app/assets/fonts:ro
      - ../../runtime:/app/runtime
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/live_admin
      CORS_ORIGINS: "*"
      GATEWAY_API_BASE: ${GATEWAY_API_BASE:-http://host.docker.internal:8090}
      WEBHOOK_STATE_URL: ${WEBHOOK_STATE_URL:-}
      WEBHOOK_EVENT_URL: ${WEBHOOK_EVENT_URL:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      OUTBOX_RETRY_MAX: ${OUTBOX_RETRY_MAX:-10}
      OUTBOX_RETRY_BASE_SECONDS: ${OUTBOX_RETRY_BASE_SECONDS:-5}
      PUBLIC_HLS_BASE: ${PUBLIC_HLS_BASE:-https://console.fineludens.kr}
      GATEWAY_STATUS_TIMEOUT_SECONDS: ${GATEWAY_STATUS_TIMEOUT_SECONDS:-1.0}
      HLS_PROBE_TIMEOUT_SECONDS: ${HLS_PROBE_TIMEOUT_SECONDS:-1.5}
      OPERATOR_ACCESS_KEY: ${OPERATOR_ACCESS_KEY:-}
      OPERATOR_ACCESS_KEY_HASH: ${OPERATOR_ACCESS_KEY_HASH:-}
      SUPERADMIN_ACCESS_KEY: ${SUPERADMIN_ACCESS_KEY:-}
      SUPERADMIN_ACCESS_KEY_HASH: ${SUPERADMIN_ACCESS_KEY_HASH:-}
      MEDIA_CONTROL_URL: ${MEDIA_CONTROL_URL:-}
      MEDIA_CONTROL_TOKEN: ${MEDIA_CONTROL_TOKEN:-}
      MEDIA_INSTANCE_ID: ${MEDIA_INSTANCE_ID:-}
      MEDIA_INSTANCE_NAME: ${MEDIA_INSTANCE_NAME:-live-admin-media}
      HIGHLIGHT_WORKER_CONTROL_URL: ${HIGHLIGHT_WORKER_CONTROL_URL:-}
      HIGHLIGHT_WORKER_CONTROL_TOKEN: ${HIGHLIGHT_WORKER_CONTROL_TOKEN:-}
      HIGHLIGHT_WORKER_INSTANCE_ID: ${HIGHLIGHT_WORKER_INSTANCE_ID:-}
      HIGHLIGHT_WORKER_INSTANCE_NAME: ${HIGHLIGHT_WORKER_INSTANCE_NAME:-fhl-gpu-worker}
      # FinePlay 연동 (S3 원본/결과 왕복 + 내부 API). 값은 .env 에만 둔다.
      HIGHLIGHT_S3_BUCKET: ${HIGHLIGHT_S3_BUCKET:-}
      HIGHLIGHT_S3_REGION: ${HIGHLIGHT_S3_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      FINEPLAY_API_BASE: ${FINEPLAY_API_BASE:-https://api.fineplay.kr}
      FINEPLAY_API_TOKEN: ${FINEPLAY_API_TOKEN:-}
      FINEPLAY_WORKER_ID: ${FINEPLAY_WORKER_ID:-fpc-worker-1}
      FINEPLAY_PIPELINE_VERSION: ${FINEPLAY_PIPELINE_VERSION:-fpc-transport-v0.1}
      # Broadcast showroom assets. The image URLs are public, but writes use a
      # separate ingest key and S3 credentials never leave the API container.
      BROADCAST_PUBLIC_BASE_URL: ${BROADCAST_PUBLIC_BASE_URL:-https://broadcast.fineludens.kr}
      BROADCAST_S3_BUCKET: ${BROADCAST_S3_BUCKET:-}
      BROADCAST_S3_REGION: ${BROADCAST_S3_REGION:-}
      BROADCAST_S3_ENDPOINT_URL: ${BROADCAST_S3_ENDPOINT_URL:-}
      BROADCAST_S3_PREFIX: ${BROADCAST_S3_PREFIX:-broadcast}
      BROADCAST_CDN_BASE_URL: ${BROADCAST_CDN_BASE_URL:-}
      BROADCAST_INGEST_KEY: ${BROADCAST_INGEST_KEY:-}
      BROADCAST_ASSET_REFRESH_SECONDS: ${BROADCAST_ASSET_REFRESH_SECONDS:-60}
      SYSTEM_MONITOR_ENABLED: ${SYSTEM_MONITOR_ENABLED:-1}
      SYSTEM_MONITOR_SLACK_WEBHOOK_URL: ${SYSTEM_MONITOR_SLACK_WEBHOOK_URL:-}
      SYSTEM_MONITOR_SCHEDULE_CSV_URL: ${SYSTEM_MONITOR_SCHEDULE_CSV_URL:-https://docs.google.com/spreadsheets/d/10Ha_KDtbYIJr83PAxsoirTrVvqLnGKMKbXVdIEy5ibE/export?format=csv&gid=317978883}
      SYSTEM_MONITOR_PREMATCH_MINUTES: ${SYSTEM_MONITOR_PREMATCH_MINUTES:-30}
      SYSTEM_MONITOR_POSTMATCH_MINUTES: ${SYSTEM_MONITOR_POSTMATCH_MINUTES:-180}
      SYSTEM_MONITOR_ACTIVE_CHECK_SECONDS: ${SYSTEM_MONITOR_ACTIVE_CHECK_SECONDS:-60}
      SYSTEM_MONITOR_IDLE_CHECK_SECONDS: ${SYSTEM_MONITOR_IDLE_CHECK_SECONDS:-300}
      SCHEDULE_SLACK_ENABLED: ${SCHEDULE_SLACK_ENABLED:-1}
      SCHEDULE_SLACK_WEBHOOK_URL: ${SCHEDULE_SLACK_WEBHOOK_URL:-}
      SCHEDULE_SLACK_DAILY_HOUR: ${SCHEDULE_SLACK_DAILY_HOUR:-9}
      SCHEDULE_SLACK_DAILY_MINUTE: ${SCHEDULE_SLACK_DAILY_MINUTE:-0}
      SCHEDULE_SLACK_REMINDER_MINUTES: ${SCHEDULE_SLACK_REMINDER_MINUTES:-60}
      SCHEDULE_SLACK_CHECK_SECONDS: ${SCHEDULE_SLACK_CHECK_SECONDS:-1800}
      SCHEDULE_SLACK_POST_EMPTY_DAILY: ${SCHEDULE_SLACK_POST_EMPTY_DAILY:-0}
      SCHEDULE_SLACK_MENTION_MAP_JSON: ${SCHEDULE_SLACK_MENTION_MAP_JSON:-}
      HIGHLIGHT_RUNTIME_DIR: /app/runtime/highlight
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ../../apps/web
    container_name: app-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE: /api
      NEXT_PUBLIC_DEFAULT_HLS_URL: ${NEXT_PUBLIC_DEFAULT_HLS_URL:-}
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    container_name: app-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "3000:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - api
      - web

volumes:
  pg_data:
