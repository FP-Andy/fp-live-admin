services:
  postgres:
    image: postgres:16-alpine
    container_name: app-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: live_admin
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ../../apps/api
    container_name: app-api
    restart: unless-stopped
    # 미디어 서버 주소는 .env 로 바꿀 수 있게 한다(기본값 = 지금 운영 값이라 그대로 두면 동작 동일).
    # MEDIA_PUBLIC_IP(고정 IP)·MEDIA_PRIVATE_IP(VPC 내부 IP) 하나만 바꾸면 아래 HLS·RTMP 기본값이 함께 따라간다.
    extra_hosts:
      - "stream.fineludens.kr:${MEDIA_PUBLIC_IP:-3.227.35.90}"
    volumes: &api-volumes
      - ../../templetes:/app/templetes:ro
      - ../../assets/fonts:/app/assets/fonts:ro
      - ../../assets/brand:/app/assets/brand:ro
      - ../../assets/fcm/goalkeeper:/app/assets/fcm/goalkeeper:ro
      - ../../runtime:/app/runtime
    environment: &api-environment
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/live_admin
      CORS_ORIGINS: "*"
      GATEWAY_API_BASE: ${GATEWAY_API_BASE:-http://host.docker.internal:8090}
      WEBHOOK_STATE_URL: ${WEBHOOK_STATE_URL:-}
      WEBHOOK_EVENT_URL: ${WEBHOOK_EVENT_URL:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      OUTBOX_RETRY_MAX: ${OUTBOX_RETRY_MAX:-10}
      OUTBOX_RETRY_BASE_SECONDS: ${OUTBOX_RETRY_BASE_SECONDS:-5}
      PUBLIC_HLS_BASE: ${PUBLIC_HLS_BASE:-https://console.fineludens.kr}
      GATEWAY_STATUS_TIMEOUT_SECONDS: ${GATEWAY_STATUS_TIMEOUT_SECONDS:-0.35}
      GATEWAY_STATUS_FAILURE_COOLDOWN_SECONDS: ${GATEWAY_STATUS_FAILURE_COOLDOWN_SECONDS:-15}
      HLS_PROBE_TIMEOUT_SECONDS: ${HLS_PROBE_TIMEOUT_SECONDS:-1.5}
      FPC_ADMIN_ACCOUNTS_FILE: ${FPC_ADMIN_ACCOUNTS_FILE:-/app/runtime/auth/admin-accounts.json}
      MEDIA_CONTROL_URL: ${MEDIA_CONTROL_URL:-}
      MEDIA_CONTROL_TOKEN: ${MEDIA_CONTROL_TOKEN:-}
      MEDIA_INSTANCE_ID: ${MEDIA_INSTANCE_ID:-}
      MEDIA_INSTANCE_NAME: ${MEDIA_INSTANCE_NAME:-live-admin-media}
      HIGHLIGHT_WORKER_CONTROL_URL: ${HIGHLIGHT_WORKER_CONTROL_URL:-}
      HIGHLIGHT_WORKER_CONTROL_TOKEN: ${HIGHLIGHT_WORKER_CONTROL_TOKEN:-}
      HIGHLIGHT_WORKER_INSTANCE_ID: ${HIGHLIGHT_WORKER_INSTANCE_ID:-}
      HIGHLIGHT_WORKER_INSTANCE_NAME: ${HIGHLIGHT_WORKER_INSTANCE_NAME:-fhl-gpu-worker}
      # FinePlay 연동 (S3 원본/결과 왕복 + 내부 API). 값은 .env 에만 둔다.
      HIGHLIGHT_S3_BUCKET: ${HIGHLIGHT_S3_BUCKET:-}
      HIGHLIGHT_S3_REGION: ${HIGHLIGHT_S3_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      FINEPLAY_API_BASE: ${FINEPLAY_API_BASE:-https://api.fineplay.kr}
      FINEPLAY_API_TOKEN: ${FINEPLAY_API_TOKEN:-}
      FINEPLAY_WORKER_ID: ${FINEPLAY_WORKER_ID:-fpc-worker-1}
      FINEPLAY_PIPELINE_VERSION: ${FINEPLAY_PIPELINE_VERSION:-fpc-transport-v0.1}
      # 유튜브 쿠키 파일 경로(컨테이너 안 기준). 유튜브가 데이터센터 IP 를 막을 때 이걸로 푼다.
      # .env 에만 적어 두면 전달되지 않는다 — 이 구성은 env_file 을 쓰지 않아서, 여기 적힌
      # 키만 컨테이너로 넘어간다.
      YTDLP_COOKIES: ${YTDLP_COOKIES:-}
      # PO 토큰 발급기 주소. 비우면 토큰 없이 진행한다(예전 동작).
      YTDLP_POT_BASE_URL: ${YTDLP_POT_BASE_URL:-http://potoken:4416}
      # Broadcast showroom assets. The image URLs are public, but writes use a
      # separate ingest key and S3 credentials never leave the API container.
      BROADCAST_PUBLIC_BASE_URL: ${BROADCAST_PUBLIC_BASE_URL:-https://broadcast.fineludens.kr}
      BROADCAST_S3_BUCKET: ${BROADCAST_S3_BUCKET:-}
      BROADCAST_S3_REGION: ${BROADCAST_S3_REGION:-}
      BROADCAST_S3_ENDPOINT_URL: ${BROADCAST_S3_ENDPOINT_URL:-}
      BROADCAST_S3_PREFIX: ${BROADCAST_S3_PREFIX:-broadcast}
      BROADCAST_CDN_BASE_URL: ${BROADCAST_CDN_BASE_URL:-}
      BROADCAST_INGEST_KEY: ${BROADCAST_INGEST_KEY:-}
      BROADCAST_ASSET_REFRESH_SECONDS: ${BROADCAST_ASSET_REFRESH_SECONDS:-60}
      # The production c7i.8xlarge server can refresh four matches in parallel
      # while keeping enough CPU and memory headroom for the live app itself.
      BROADCAST_ASSET_RENDER_CONCURRENCY: ${BROADCAST_ASSET_RENDER_CONCURRENCY:-4}
      # Captures the existing Live Coder overlay, preserving the operator's
      # production visual rather than redrawing the graphic in the API.
      BROADCAST_LIVE_CODER_RENDER_URL: ${BROADCAST_LIVE_CODER_RENDER_URL:-http://web:3000/api/internal/broadcast-render}
      BROADCAST_RENDER_TOKEN: ${BROADCAST_RENDER_TOKEN:-}
      SCENE_MOTION_RENDER_URL: ${SCENE_MOTION_RENDER_URL:-http://web:3000/api/internal/scene-motion-render}
      SCENE_MOTION_RENDER_TOKEN: ${SCENE_MOTION_RENDER_TOKEN:-}
      SCENE_RENDER_MAX_PENDING: ${SCENE_RENDER_MAX_PENDING:-500}
      SYSTEM_MONITOR_ENABLED: ${SYSTEM_MONITOR_ENABLED:-1}
      SYSTEM_MONITOR_SLACK_WEBHOOK_URL: ${SYSTEM_MONITOR_SLACK_WEBHOOK_URL:-}
      SYSTEM_MONITOR_SCHEDULE_CSV_URL: ${SYSTEM_MONITOR_SCHEDULE_CSV_URL:-https://docs.google.com/spreadsheets/d/10Ha_KDtbYIJr83PAxsoirTrVvqLnGKMKbXVdIEy5ibE/export?format=csv&gid=317978883}
      SYSTEM_MONITOR_PREMATCH_MINUTES: ${SYSTEM_MONITOR_PREMATCH_MINUTES:-30}
      SYSTEM_MONITOR_POSTMATCH_MINUTES: ${SYSTEM_MONITOR_POSTMATCH_MINUTES:-180}
      SYSTEM_MONITOR_ACTIVE_CHECK_SECONDS: ${SYSTEM_MONITOR_ACTIVE_CHECK_SECONDS:-60}
      SYSTEM_MONITOR_IDLE_CHECK_SECONDS: ${SYSTEM_MONITOR_IDLE_CHECK_SECONDS:-300}
      SCHEDULE_SLACK_ENABLED: ${SCHEDULE_SLACK_ENABLED:-1}
      SCHEDULE_SLACK_WEBHOOK_URL: ${SCHEDULE_SLACK_WEBHOOK_URL:-}
      SCHEDULE_SLACK_DAILY_HOUR: ${SCHEDULE_SLACK_DAILY_HOUR:-9}
      SCHEDULE_SLACK_DAILY_MINUTE: ${SCHEDULE_SLACK_DAILY_MINUTE:-0}
      SCHEDULE_SLACK_REMINDER_MINUTES: ${SCHEDULE_SLACK_REMINDER_MINUTES:-60}
      SCHEDULE_SLACK_CHECK_SECONDS: ${SCHEDULE_SLACK_CHECK_SECONDS:-1800}
      SCHEDULE_SLACK_POST_EMPTY_DAILY: ${SCHEDULE_SLACK_POST_EMPTY_DAILY:-0}
      SCHEDULE_SLACK_MENTION_MAP_JSON: ${SCHEDULE_SLACK_MENTION_MAP_JSON:-}
      HIGHLIGHT_RUNTIME_DIR: /app/runtime/highlight
      FPA_CV_S3_BUCKET: ${FPA_CV_S3_BUCKET:-}
      FPA_CV_S3_REGION: ${FPA_CV_S3_REGION:-us-east-1}
      FPA_CV_S3_ACCELERATE: ${FPA_CV_S3_ACCELERATE:-0}
      FPA_CV_INSTANCE_ROLE: ${FPA_CV_INSTANCE_ROLE:-1}
      FPA_CV_WORKER_URL: ${FPA_CV_WORKER_URL:-}
      FPA_CV_WORKER_TOKEN: ${FPA_CV_WORKER_TOKEN:-}
      FPA_CV_ALLOWED_ORIGINS: ${FPA_CV_ALLOWED_ORIGINS:-https://console.fineludens.kr}
      # GPU 유휴 자동 종료(app/gpu_auto_stop.py). 기본은 꺼짐 — 운영 .env 에서 1 로 켠다.
      # 알림 주소를 비우면 SYSTEM_MONITOR_SLACK_WEBHOOK_URL 로 보낸다.
      GPU_AUTO_STOP_ENABLED: ${GPU_AUTO_STOP_ENABLED:-0}
      GPU_AUTO_STOP_IDLE_MINUTES: ${GPU_AUTO_STOP_IDLE_MINUTES:-60}
      GPU_AUTO_STOP_CHECK_SECONDS: ${GPU_AUTO_STOP_CHECK_SECONDS:-300}
      GPU_AUTO_STOP_STALE_HOURS: ${GPU_AUTO_STOP_STALE_HOURS:-12}
      GPU_AUTO_STOP_SLACK_WEBHOOK_URL: ${GPU_AUTO_STOP_SLACK_WEBHOOK_URL:-}
      # 직원용 FLA 에이전트 API. 끄기: .env 에 AGENT_FLA_ENABLED=0(전체, 503) 또는 AGENT_FLA_WRITE_ENABLED=0(쓰기만) 후 api 재생성.
      # 스위치 기본 1(켜짐) — 빈 값은 코드에서 "꺼짐"으로 읽히므로 기본값을 비워 두면 안 된다.
      AGENT_FLA_ENABLED: ${AGENT_FLA_ENABLED:-1}
      AGENT_FLA_WRITE_ENABLED: ${AGENT_FLA_WRITE_ENABLED:-1}
      # 사용 한도는 기본 없음(빈 값·0). 양수를 넣을 때만 건다.
      AGENT_FLA_RATE_PER_MINUTE: ${AGENT_FLA_RATE_PER_MINUTE:-}
      AGENT_FLA_WRITE_RATE_PER_MINUTE: ${AGENT_FLA_WRITE_RATE_PER_MINUTE:-}
      AGENT_FLA_DAILY_WRITES: ${AGENT_FLA_DAILY_WRITES:-}
      AGENT_FLA_DAILY_PLANS: ${AGENT_FLA_DAILY_PLANS:-}
      AGENT_FLA_MAX_ITEMS: ${AGENT_FLA_MAX_ITEMS:-}
      AGENT_FLA_PLAN_TTL_SECONDS: ${AGENT_FLA_PLAN_TTL_SECONDS:-600}
      AGENT_FLA_LIVE_SETTLE_SECONDS: ${AGENT_FLA_LIVE_SETTLE_SECONDS:-30}
    depends_on:
      postgres:
        condition: service_healthy

  highlight-render:
    build:
      context: ../../apps/api
    container_name: app-highlight-render
    restart: unless-stopped
    init: true
    command: ["python", "-m", "app.highlight_render_worker"]
    stop_grace_period: 30s
    cpus: ${HIGHLIGHT_RENDER_CPUS:-2}
    mem_limit: ${HIGHLIGHT_RENDER_MEMORY:-4g}
    # CPU 우선순위(가중치)만 낮춘다. 기본은 1024, 렌더 3종은 256 → CPU가 모자랄 때만
    # api·web·postgres·nginx·recording 이 렌더보다 먼저 CPU를 받는다(cgroup v1 은 4배,
    # cgroup v2 는 런타임 환산에 따라 약 3배 — 로컬 실측 74%:26%).
    # 한가할 때는 가중치가 아무 영향이 없어서 렌더 속도는 그대로다(상한은 위 cpus 가 따로 정한다).
    # 다른 서비스에 1024 를 직접 적지 않는다: cgroup v2 에서 "미설정"과 "1024"가 다르게 환산될 수 있다.
    cpu_shares: 256
    healthcheck:
      test: ["CMD", "python", "-c", "import time; from pathlib import Path; assert time.time()-Path('/tmp/highlight-render-heartbeat').stat().st_mtime < 30"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 3
    volumes: *api-volumes
    environment:
      <<: *api-environment
      DB_POOL_SIZE: 2
      DB_MAX_OVERFLOW: 1
      HIGHLIGHT_CODEC_THREADS: 2
      HIGHLIGHT_DECODE_THREADS: 1
      HIGHLIGHT_FILTER_THREADS: 1
    depends_on:
      postgres:
        condition: service_healthy

  # Scene requests only enqueue database rows. This process owns capture waits
  # and retries, independently of API request threads and highlight merging.
  scene-render:
    build:
      context: ../../apps/api
    container_name: app-scene-render
    restart: unless-stopped
    init: true
    command: ["python", "-m", "app.scene_motion_worker"]
    stop_grace_period: 20s
    cpus: 0.5
    mem_limit: 512m
    cpu_shares: 256  # 렌더는 양보한다 — highlight-render 설명 참고
    environment:
      <<: *api-environment
      DB_POOL_SIZE: 2
      DB_MAX_OVERFLOW: 1
      SCENE_MOTION_RENDER_URL: http://scene-capture:3000/api/internal/scene-motion-render
    healthcheck:
      test: ["CMD", "python", "-c", "import time; from pathlib import Path; assert time.time()-Path('/tmp/scene-render-heartbeat').stat().st_mtime < 30"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      scene-capture:
        condition: service_healthy

  # Reuse the exact production web assets/component in an internal-only,
  # resource-limited renderer. Never capture inside the user-facing web service.
  scene-capture:
    image: ${SCENE_CAPTURE_IMAGE:-app-web:latest}
    container_name: app-scene-capture
    restart: unless-stopped
    init: true
    cpus: ${SCENE_CAPTURE_CPUS:-1}
    mem_limit: ${SCENE_CAPTURE_MEMORY:-1536m}
    cpu_shares: 256  # 렌더는 양보한다 — highlight-render 설명 참고
    environment:
      SCENE_MOTION_RENDER_TOKEN: ${SCENE_MOTION_RENDER_TOKEN:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3

  # 유튜브 PO 토큰 발급기. yt-dlp 플러그인이 여기에 물어본다.
  #
  # 유튜브는 데이터센터 IP 에서 오는 요청에 PO 토큰을 요구하고, 없으면 고화질
  # 포맷을 아예 목록에서 뺀다. 그러면 yt-dlp 는 360p 만 주는 하위 클라이언트로
  # 밀려나고, 우리는 그걸 정상 완료로 받아 왔다(2026-09-29 실제 사고).
  potoken:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    container_name: app-potoken
    restart: unless-stopped
    init: true
    # 토큰 하나 만드는 데만 쓰는 작은 서버다. 넉넉히 줄 이유가 없다.
    cpus: 0.5
    mem_limit: 512m
    expose:
      - "4416"

  recording:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile.recording
    container_name: app-recording
    restart: unless-stopped
    init: true
    stop_grace_period: 90s
    cpus: 1.5
    mem_limit: 768m
    volumes:
      - recording_data:/recordings
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/live_admin
      DB_POOL_SIZE: 3
      DB_MAX_OVERFLOW: 2
      RECORDING_ROOT: /recordings
      RECORDING_RTMP_PULL_BASE: ${RECORDING_RTMP_PULL_BASE:-rtmp://${MEDIA_PRIVATE_IP:-172.31.95.167}:1935/live}
      RECORDING_RTMP_PUBLIC_BASE: ${RECORDING_RTMP_PUBLIC_BASE:-rtmp://${MEDIA_PUBLIC_IP:-3.227.35.90}:1935/live}
      HIGHLIGHT_S3_BUCKET: ${HIGHLIGHT_S3_BUCKET:-}
      HIGHLIGHT_S3_REGION: ${HIGHLIGHT_S3_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      MEDIA_CONTROL_URL: ${MEDIA_CONTROL_URL:-}
      MEDIA_CONTROL_TOKEN: ${MEDIA_CONTROL_TOKEN:-}
      MEDIA_INSTANCE_ID: ${MEDIA_INSTANCE_ID:-}
      MEDIA_INSTANCE_NAME: ${MEDIA_INSTANCE_NAME:-live-admin-media}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ../../apps/web
    container_name: app-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE: /api
      NEXT_PUBLIC_DEFAULT_HLS_URL: ${NEXT_PUBLIC_DEFAULT_HLS_URL:-}
      BROADCAST_OVERLAY_ORIGIN: ${BROADCAST_OVERLAY_ORIGIN:-http://nginx}
      BROADCAST_RENDER_TOKEN: ${BROADCAST_RENDER_TOKEN:-}
      SCENE_MOTION_RENDER_TOKEN: ${SCENE_MOTION_RENDER_TOKEN:-}
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    container_name: app-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "3000:80"
    # 공식 nginx 이미지는 시작할 때 /etc/nginx/templates/*.template 의 ${변수} 를 환경변수로
    # 채워 /etc/nginx/conf.d/ 에 쓴다. 필터로 HLS_UPSTREAM 만 치환해 $host 같은 nginx 변수는 건드리지 않는다.
    environment:
      HLS_UPSTREAM: ${HLS_UPSTREAM:-http://${MEDIA_PRIVATE_IP:-172.31.95.167}:8080}
      NGINX_ENVSUBST_FILTER: ^HLS_UPSTREAM$$
    volumes:
      - ./nginx/templates/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - api
      - web

volumes:
  recording_data:
  pg_data:
